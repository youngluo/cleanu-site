<script>
/* 先落主题模式，避免手动选色后刷新闪一下 */
try {
  var mode = localStorage.getItem('cleanu:theme-mode');
  if (mode === 'light' || mode === 'dark' || mode === 'auto') {
    document.documentElement.dataset.themeMode = mode;
  }
} catch (e) { /* 读不到就用系统偏好 */ }
</script>
